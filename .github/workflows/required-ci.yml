name: Required CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RRWD_NPM_READ_TOKEN }}
          pnpm_config_//registry.npmjs.org/:_authToken: ${{ secrets.RRWD_NPM_READ_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Check release candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RRWD_NPM_READ_TOKEN }}
          pnpm_config_//registry.npmjs.org/:_authToken: ${{ secrets.RRWD_NPM_READ_TOKEN }}
        run: pnpm run prepublishOnly
